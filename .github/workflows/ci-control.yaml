name: ci-control
on:
  pull_request:
  workflow_dispatch:
# The permissions nextstrain/.github pathogen-repo-ci.yaml@master requests, so
# both callers get the same token a nextstrain repo would.
permissions:
  contents: read
  id-token: write
  packages: read
jobs:
  ci:
    uses: nextstrain/.github/.github/workflows/pathogen-repo-ci.yaml@master
    with:
      repo: nextstrain/zika
      runtimes: |
        - docker
